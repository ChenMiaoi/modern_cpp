cpp11:
  shared_ptr:
    title: "std::shared_ptr"
    docs:
      - "docs/standards/cpp11/smart-pointers.md"
      - "docs/libraries/libstdcxx/shared-ptr-tree-function.md"
      - "docs/libraries/llvm/function-shared-ptr.md"
    exercises:
      - "exercises/cpp11-classes/smartptr2.cpp"
    solutions:
      - "exercises/solutions/smartptr2.cpp"
    implementation:
      libstdcxx:
        path: "references/impl/gcc/libstdc++-v3/include/bits/shared_ptr_base.h"
        symbols:
          - "std::shared_ptr"
          - "_Sp_counted_base"
          - "_Sp_counted_ptr_inplace"
      libcxx:
        path: "references/impl/llvm-project/libcxx/include/__memory/shared_ptr.h"
        symbols:
          - "std::shared_ptr"
          - "__shared_ptr_pointer"
          - "__shared_ptr_emplace"
    verification:
      api:
        - 'node exercises/cpplings.mjs run smartptr2'
      source:
        - 'grep -R "_Sp_counted_base" references/impl/gcc/libstdc++-v3/include/bits/shared_ptr_base.h'
        - 'grep -R "__shared_ptr_emplace" references/impl/llvm-project/libcxx/include/__memory/shared_ptr.h'

  unique_ptr:
    title: "std::unique_ptr"
    docs:
      - "docs/standards/cpp11/smart-pointers.md"
      - "docs/libraries/llvm/ranges-unique-ptr.md"
    exercises:
      - "exercises/cpp11-classes/smartptr1.cpp"
    solutions:
      - "exercises/solutions/smartptr1.cpp"
    implementation:
      libstdcxx:
        path: "references/impl/gcc/libstdc++-v3/include/bits/unique_ptr.h"
        symbols:
          - "std::unique_ptr"
          - "default_delete"
          - "__uniq_ptr_impl"
      libcxx:
        path: "references/impl/llvm-project/libcxx/include/__memory/unique_ptr.h"
        symbols:
          - "std::unique_ptr"
          - "default_delete"
          - "__unique_ptr_deleter_sfinae"
    verification:
      api:
        - 'node exercises/cpplings.mjs run smartptr1'
      source:
        - 'grep -R "__uniq_ptr_impl" references/impl/gcc/libstdc++-v3/include/bits/unique_ptr.h'
        - 'grep -R "__unique_ptr_deleter_sfinae" references/impl/llvm-project/libcxx/include/__memory/unique_ptr.h'

  function:
    title: "std::function"
    docs:
      - "docs/libraries/libstdcxx/shared-ptr-tree-function.md"
      - "docs/libraries/llvm/function-shared-ptr.md"
    implementation:
      libstdcxx:
        path: "references/impl/gcc/libstdc++-v3/include/bits/std_function.h"
        symbols:
          - "std::function"
          - "_Function_base"
          - "_Function_handler"
      libcxx:
        path: "references/impl/llvm-project/libcxx/include/__functional/function.h"
        symbols:
          - "std::function"
          - "__value_func"
          - "__policy_func"
    verification:
      source:
        - 'grep -R "_Function_handler" references/impl/gcc/libstdc++-v3/include/bits/std_function.h'
        - 'grep -R "__policy_func" references/impl/llvm-project/libcxx/include/__functional/function.h'

  vector:
    title: "std::vector"
    docs:
      - "docs/libraries/libstdcxx/vector-hashtable.md"
      - "docs/libraries/llvm/vector-string.md"
    implementation:
      libstdcxx:
        path: "references/impl/gcc/libstdc++-v3/include/bits/stl_vector.h"
        symbols:
          - "std::vector"
          - "_Vector_impl_data"
